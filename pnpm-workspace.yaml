packages:
  - packages/*
# Imported peers are declared explicitly; optional tooling peers should not enter the lockfile.
autoInstallPeers: false
allowBuilds:
  esbuild: false
  sharp: false
  workerd: false
catalog:
  vite: 8.3.8
  vitest: 5.1.0
  '@vitest/coverage-v8': 5.1.0
minimumReleaseAgeExclude:
  - '@chillet/postcss-custom-mixins@0.3.0'
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
