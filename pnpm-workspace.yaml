packages:
  - packages/*
allowBuilds:
  esbuild: false
  sharp: false
  workerd: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
  vite-plus: 0.2.4
  vitest: 4.1.10
  '@vitest/coverage-v8': 4.1.10
minimumReleaseAgeExclude:
  - '@chillet/postcss-custom-mixins@0.3.0'
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
